[build-system]
requires = ["setuptools>=80.0", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "superset-api-plus"
version = "1.0.0a1"
description = "A Python client for automating dashboards and charts in Apache Superset."
readme = "README.md"
license = { text = "MPL-2.0" }
authors = [
  { name = "COSINF/DIGTI/IFRN", email = "jailtoncarlos@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["superset", "dashboard", "automation", "api", "client"]
dependencies = [
  "requests>=2.34.2",
  "pyyaml>=6.0.3",
  "anytree>=2.13.0",
  "shortuuid>=1.0.13",
  "typing_extensions>=4.16.0",
  "beautifulsoup4>=4.15.0"
]

[project.optional-dependencies]
dev = [
  "ipdb>=0.13.13",
  "ipython>=8.39.0",
  "pre-commit>=4.6.2",
  "mypy==2.4.0",
  "ruff>=0.17.2",
  "tabulate>=0.10.0",
  "twine>=7.0.0"
]

graph = [
  "graphviz>=0.21"
]

test = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "requests-mock>=1.12.1"
]

[project.urls]
"Source Code" = "https://github.com/jailtoncarlos/superset-api-plus"
"Tracker" = "https://github.com/jailtoncarlos/superset-api-plus/issues"

[tool.black]
line-length = 127

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 127
exclude = ["tests/*"]

[tool.ruff.lint]
# C901 (complexidade) não entra aqui: é aplicada pela catraca bin/scripts/complexidade-nova.py,
# que barra função nova ou piorada acima do limite sem punir o legado (mesmo esquema do SUAP).
select = ["E", "F", "I", "UP", "B", "C4", "W", "T201", "T100"]  # T201 = print, T100 = pdb

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# OrderBy é dataclass imutável: seguro como valor padrão de argumento.
extend-immutable-calls = ["supersetapiplus.charts.metric.OrderBy"]

[tool.ruff.lint.per-file-ignores]
# Scripts de exemplo imprimem o resultado por design.
"examples/*" = ["T201"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.codespell]
# Recortes gerados a partir do Superset (dados, não texto do projeto).
skip = "tests/fixtures/*"
# Palavras em português (docstrings, logs e mensagens) que o dicionário inglês do codespell
# confunde com erros de grafia.
ignore-words-list = "classe,itens,copie,repete,controles,oficial,conter,gere,ser,erro,erros,limite,nome,nomes,cliente,atual,argumentos,construtor,auxiliar,ignora,zar,validade,utiliza,pares,inicial,essencial,controle,comandos,autor"
