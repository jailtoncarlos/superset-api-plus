name: Python package

on:
  push:
  pull_request:

jobs:
  lint:
    # Mesmos hooks do pre-commit local (ruff, codespell, fins de linha e a catraca de
    # complexidade), aplicados só ao que o PR altera em relação à branch de destino.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # a catraca compara com o merge-base da branch de destino

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit on the PR diff
        run: >-
          pre-commit run --show-diff-on-failure
          --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,graph]"

      - name: Run tests
        run: pytest --cov=supersetapiplus tests
