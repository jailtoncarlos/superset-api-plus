name: Python package

on:
  push:
  pull_request:

jobs:
  lint:
    # Same hooks as the local pre-commit (ruff, codespell, line endings, the complexity ratchet, mypy, import
    # layers and the conformance checks), applied only to what the PR changes relative to the target branch.
    # The hooks that import the package run in the environment of uv.lock (uv run --locked).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the ratchet compares against the merge-base of the target branch

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          python-version: "3.12"

      - name: Install the project (uv.lock)
        run: uv sync --locked --all-extras

      - name: Run pre-commit on the PR diff
        run: >-
          uv run --locked --all-extras pre-commit run --show-diff-on-failure
          --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          python-version: ${{ matrix.python-version }}

      - name: Install the project (uv.lock)
        # --locked fails when uv.lock is out of date with pyproject.toml.
        run: uv sync --locked --extra test --extra graph

      - name: Run tests
        # The whole tests/ tree: integration tests skip themselves without the stack, and no test
        # directory can be left out of CI unnoticed.
        run: uv run --locked --extra test --extra graph pytest --cov=supersetapiplus tests

  lowest:
    # The floors of the runtime dependencies in pyproject.toml stay at or below the constraints of the Airflow
    # version of the integration that embeds the library, so the suite must pass with the lowest direct
    # versions (installed with uv pip, which leaves uv.lock untouched).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          python-version: ${{ matrix.python-version }}

      - name: Install the lowest direct versions
        run: |
          uv venv
          uv pip install --resolution lowest-direct ".[test]"

      - name: Run unit tests
        run: .venv/bin/python -m pytest tests/unit

  integration:
    # Server behavior is tested against a real Superset (tests/integration): the compose stack of the
    # repository, configured by .env.example, on one Python version.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          python-version: "3.12"

      - name: Install the project (uv.lock)
        run: uv sync --locked --extra test

      - name: Start the Superset test stack
        run: |
          cp .env.example .env
          docker compose -p superset-api-plus up -d --build
          timeout 600 bash -c 'until curl -sf http://127.0.0.1:8089/health >/dev/null; do sleep 5; done'

      - name: Run integration tests
        env:
          SUPERSET_INTEGRATION: "1"
        run: uv run --locked --extra test pytest -v tests/integration

      - name: Superset logs
        if: failure()
        run: docker compose -p superset-api-plus logs --tail 200 superset

      - name: Stop the stack
        if: always()
        run: docker compose -p superset-api-plus down -v
