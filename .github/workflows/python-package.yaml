name: Python package

on:
  push:
  pull_request:

jobs:
  lint:
    # Same hooks as the local pre-commit (ruff, codespell, line endings and the complexity
    # ratchet), applied only to what the PR changes relative to the target branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the ratchet compares against the merge-base of the target branch

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit on the PR diff
        run: >-
          pre-commit run --show-diff-on-failure
          --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,graph]"

      - name: Run tests
        # The whole tests/ tree: integration tests skip themselves without the stack, and no test
        # directory can be left out of CI unnoticed.
        run: pytest --cov=supersetapiplus tests

  integration:
    # Server behavior is tested against a real Superset (tests/integration): the compose stack of the
    # repository, configured by .env.example, on one Python version.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Start the Superset test stack
        run: |
          cp .env.example .env
          docker compose -p superset-api-plus up -d --build
          timeout 600 bash -c 'until curl -sf http://127.0.0.1:8089/health >/dev/null; do sleep 5; done'

      - name: Run integration tests
        env:
          SUPERSET_INTEGRATION: "1"
        run: pytest -v tests/integration

      - name: Superset logs
        if: failure()
        run: docker compose -p superset-api-plus logs --tail 200 superset

      - name: Stop the stack
        if: always()
        run: docker compose -p superset-api-plus down -v
