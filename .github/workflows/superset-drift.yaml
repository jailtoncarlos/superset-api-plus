name: Superset drift

# Compares the Superset sources of the newest release and of master with the pinned excerpts in
# tests/fixtures (bin/scripts/superset_drift.py), so a version bump starts from a known list of differences.
# The run fails when the newest release differs from the pinned excerpts (a new release to support, or a
# fixture edited by hand); master is reported only. The report is the job summary and an artifact.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      refs:
        description: "Superset refs reported only (tags or branches, space-separated)"
        default: "master"
        required: false

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the extractor dependencies
        run: python -m pip install "pyyaml>=6.0"

      - name: Compare the Superset sources with the pinned excerpts
        env:
          GITHUB_TOKEN: ${{ github.token }}  # authenticated GitHub API calls (higher rate limit)
          REFS: ${{ inputs.refs || 'master' }}
        run: |
          # shellcheck disable=SC2086  # REFS is split into words on purpose (several refs)
          python bin/scripts/superset_drift.py --report drift.md --out-dir drift --fail-on latest $REFS

      - name: Report
        if: always()
        run: test -f drift.md && cat drift.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: superset-drift
          path: |
            drift.md
            drift/
          if-no-files-found: ignore
