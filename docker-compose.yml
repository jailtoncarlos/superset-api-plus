# Integration test stack: Superset (configurable version) + Postgres for the test data.
# Configuration in .env (copy from .env.example). Usage: docker compose up -d --build
services:
  superset:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
      args:
        SUPERSET_IMAGE: ${SUPERSET_IMAGE:-apachesuperset.docker.scarf.sh/apache/superset}
        SUPERSET_VERSION: ${SUPERSET_VERSION:-6.1.0}
    image: superset-api-plus-test-superset:${SUPERSET_VERSION:-6.1.0}
    ports:
      - "127.0.0.1:${SUPERSET_TEST_PORT:-8089}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set SUPERSET_SECRET_KEY in .env}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:?set SUPERSET_ADMIN_USERNAME in .env}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set SUPERSET_ADMIN_PASSWORD in .env}
      SUPERSET_LOAD_EXAMPLES: ${SUPERSET_LOAD_EXAMPLES:-0}
    depends_on:
      - postgres

  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    hostname: pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tests}
