# Stack de testes de integração: Superset (versão configurável) + Postgres para os dados de teste.
# Configuração no .env (copie de .env.example). Uso: docker compose up -d --build
services:
  superset:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
      args:
        SUPERSET_IMAGE: ${SUPERSET_IMAGE:-apachesuperset.docker.scarf.sh/apache/superset}
        SUPERSET_VERSION: ${SUPERSET_VERSION:-6.1.0}
    image: superset-api-plus-test-superset:${SUPERSET_VERSION:-6.1.0}
    ports:
      - "127.0.0.1:${SUPERSET_TEST_PORT:-8089}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?defina SUPERSET_SECRET_KEY no .env}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:?defina SUPERSET_ADMIN_USERNAME no .env}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?defina SUPERSET_ADMIN_PASSWORD no .env}
      SUPERSET_LOAD_EXAMPLES: ${SUPERSET_LOAD_EXAMPLES:-0}
    depends_on:
      - postgres

  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    hostname: pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-testes}
