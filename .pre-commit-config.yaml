repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: Spell Checker
        additional_dependencies: ["tomli"]
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: ["--fix"]
        name: Ruff (linter)
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: ["--explicit-package-bases"]
        files: ^supersetapiplus/
        additional_dependencies: ["types-requests", "types-PyYAML"]
        # Manual até o mypy --strict (configurado no pyproject) zerar na T13: hoje acusa ~855
        # erros e bloquearia todo commit. Rodar com: pre-commit run mypy --hook-stage manual
        stages: [manual]

  - repo: local
    hooks:
      - id: complexidade-nova
        name: Barra complexidade ciclomática > 10 nova ou aumentada (legado sem piora passa)
        language: python
        additional_dependencies: ["ruff==0.17.2"]
        entry: python bin/scripts/complexidade-nova.py
        types:
          - python
        pass_filenames: true
      - id: conformidade-openapi
        name: Conformidade com a especificação OpenAPI do Superset (payloads e rotas)
        # Roda a partir do código-fonte (sem instalar o pacote); as dependências de runtime abaixo
        # repetem as do pyproject até a migração para o uv (T14), quando o hook passa a usar `uv run`.
        language: python
        additional_dependencies:
          - "requests>=2.32"
          - "requests-cache>=1.2"
          - "beautifulsoup4>=4.12"
          - "pyyaml>=6.0"
          - "anytree>=2.12"
          - "shortuuid>=1.0"
          - "typing_extensions>=4.12"
          - "pytest>=8"
          - "requests-mock>=1.12"
        entry: python -m pytest -q -p no:cacheprovider tests/unit/test_conformidade_openapi.py
        files: ^(supersetapiplus/|tests/fixtures/superset_openapi_|tests/unit/test_conformidade_openapi\.py)
        pass_filenames: false
