repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: Spell Checker
        additional_dependencies: ["tomli"]
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: ["--fix"]
        name: Ruff (linter)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: complexity-ratchet
        name: Block new or increased cyclomatic complexity > 10 (unchanged legacy passes)
        language: python
        additional_dependencies: ["ruff==0.17.2"]
        entry: python bin/scripts/complexity_ratchet.py
        types:
          - python
        pass_filenames: true
      # The hooks below import the package: they run in the project environment of uv.lock (`uv run --locked`),
      # so their dependencies are the ones of pyproject.toml, not a copy kept here. They need uv installed.
      - id: mypy
        name: mypy --strict
        # Whole package under mypy --strict ([tool.mypy] in pyproject.toml); the legacy and compatibility
        # modules marked ignore_errors there are not part of the typed public API.
        language: system
        entry: uv run --locked --all-extras mypy --explicit-package-bases
        files: ^supersetapiplus/
        types: [python]
      - id: import-layers
        # Layer contracts of the package ([tool.importlinter] in pyproject.toml): each layer imports only
        # the layers below it, and the model layer (core) has no HTTP.
        name: Import layers (import-linter)
        language: system
        entry: uv run --locked --all-extras lint-imports
        files: ^(supersetapiplus/|pyproject\.toml$)
        pass_filenames: false
      - id: superset-conformance
        # Request payloads and routes vs. the official OpenAPI specification (versioned subset in tests/fixtures).
        name: Superset conformance (OpenAPI payloads and routes)
        language: system
        entry: uv run --locked --all-extras python -m pytest -q -p no:cacheprovider tests/unit/test_openapi_conformance.py
        files: ^(supersetapiplus/|tests/fixtures/superset_openapi_|tests/unit/test_openapi_conformance\.py)
        pass_filenames: false
      - id: model-attributes
        # Model attributes vs. the Superset source: every enum has a declared source and its official values,
        # every `str` field is an enum or declared free text, and a new chart gets the params the UI gives it
        # (tests/fixtures/superset_enums_<version>.json and ui_defaults_<version>/, generated by bin/scripts), every
        # key of the excerpt is checked somewhere, and the extractors fail on a symbol that disappeared.
        name: Model attributes (enums, str fields and UI defaults vs. the Superset source)
        language: system
        entry: >-
          uv run --locked --all-extras python -m pytest -q -p no:cacheprovider tests/unit/test_enum_conformance.py
          tests/unit/test_attribute_types.py tests/unit/test_ui_defaults.py tests/unit/test_extractors.py
        files: ^(supersetapiplus/|bin/scripts/|tests/fixtures/(superset_enums_|ui_defaults_)|tests/unit/test_(enum_conformance|attribute_types|ui_defaults|extractors)\.py)
        pass_filenames: false
