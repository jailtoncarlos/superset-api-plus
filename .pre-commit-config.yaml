repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: Spell Checker
        additional_dependencies: ["tomli"]
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: ["--fix"]
        name: Ruff (linter)
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: ["--explicit-package-bases"]
        files: ^supersetapiplus/
        additional_dependencies: ["types-requests", "types-PyYAML"]
        # Whole package, manual until mypy --strict (configured in pyproject) reaches zero (T13): run with
        # pre-commit run mypy --hook-stage manual
        stages: [manual]
      - id: mypy
        alias: mypy-typed
        name: mypy --strict (typed layers)
        # Ratchet: the modules already clean under mypy --strict stay clean. Add a package here once it reaches
        # zero errors; errors of the modules they import are not reported (--follow-imports=silent).
        args: ["--explicit-package-bases", "--follow-imports=silent"]
        files: ^supersetapiplus/(transport/|auth/|services/|exceptions\.py|deprecation\.py|query_string\.py)
        additional_dependencies: ["types-requests", "types-PyYAML", "beautifulsoup4>=4.11", "urllib3>=2"]

  - repo: local
    hooks:
      - id: complexity-ratchet
        name: Block new or increased cyclomatic complexity > 10 (unchanged legacy passes)
        language: python
        additional_dependencies: ["ruff==0.17.2"]
        entry: python bin/scripts/complexity_ratchet.py
        types:
          - python
        pass_filenames: true
      - id: import-layers
        # Layer contracts of the package ([tool.importlinter] in pyproject.toml): each layer imports only
        # the layers below it, and the model layer (core) has no HTTP.
        name: Import layers (import-linter)
        language: python
        additional_dependencies: ["import-linter>=2.1"]
        entry: lint-imports
        files: ^(supersetapiplus/|pyproject\.toml$)
        pass_filenames: false
      - id: superset-conformance
        # Request payloads and routes vs. the official OpenAPI specification (versioned subset in tests/fixtures).
        name: Superset conformance (OpenAPI payloads and routes)
        # Runs from the source tree (without installing the package); the runtime dependencies below repeat
        # pyproject.toml because the CI lint job runs pre-commit without uv. Switching these hooks to
        # `uv run --locked` needs the CI change of issue #317 (pending authorization).
        language: python
        additional_dependencies:
          - "requests>=2.32"
          - "beautifulsoup4>=4.12"
          - "pyyaml>=6.0"
          - "anytree>=2.12"
          - "shortuuid>=1.0"
          - "typing_extensions>=4.12"
          - "pytest>=8"
          - "requests-mock>=1.12"
        entry: python -m pytest -q -p no:cacheprovider tests/unit/test_openapi_conformance.py
        files: ^(supersetapiplus/|tests/fixtures/superset_openapi_|tests/unit/test_openapi_conformance\.py)
        pass_filenames: false
      - id: model-attributes
        # Model attributes vs. the Superset source: every enum has a declared source and its official values,
        # every `str` field is an enum or declared free text, and a new chart gets the params the UI gives it
        # (tests/fixtures/superset_enums_<version>.json and ui_defaults_<version>/, generated by bin/scripts).
        name: Model attributes (enums, str fields and UI defaults vs. the Superset source)
        language: python
        additional_dependencies:
          - "requests>=2.32"
          - "beautifulsoup4>=4.12"
          - "pyyaml>=6.0"
          - "anytree>=2.12"
          - "shortuuid>=1.0"
          - "typing_extensions>=4.12"
          - "pytest>=8"
          - "requests-mock>=1.12"
        entry: python -m pytest -q -p no:cacheprovider tests/unit/test_enum_conformance.py tests/unit/test_attribute_types.py tests/unit/test_ui_defaults.py
        files: ^(supersetapiplus/|tests/fixtures/(superset_enums_|ui_defaults_)|tests/unit/test_(enum_conformance|attribute_types|ui_defaults)\.py)
        pass_filenames: false
