repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: Spell Checker
        additional_dependencies: ["tomli"]
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: ["--fix"]
        name: Ruff (linter)
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: ["--explicit-package-bases"]
        files: ^supersetapiplus/
        additional_dependencies: ["types-requests", "types-PyYAML"]
        # Manual until mypy --strict (configured in pyproject) reaches zero in T13: it currently reports ~855
        # errors and would block every commit. Run with: pre-commit run mypy --hook-stage manual
        stages: [manual]

  - repo: local
    hooks:
      - id: complexity-ratchet
        name: Block new or increased cyclomatic complexity > 10 (unchanged legacy passes)
        language: python
        additional_dependencies: ["ruff==0.17.2"]
        entry: python bin/scripts/complexity_ratchet.py
        types:
          - python
        pass_filenames: true
      - id: superset-conformance
        # Request payloads and routes vs. the official OpenAPI specification (versioned subset in tests/fixtures).
        name: Superset conformance (OpenAPI payloads and routes)
        # Runs from the source tree (without installing the package); the runtime dependencies below
        # repeat the pyproject ones until the migration to uv (T14), when the hook switches to `uv run`.
        language: python
        additional_dependencies:
          - "requests>=2.32"
          - "beautifulsoup4>=4.12"
          - "pyyaml>=6.0"
          - "anytree>=2.12"
          - "shortuuid>=1.0"
          - "typing_extensions>=4.12"
          - "pytest>=8"
          - "requests-mock>=1.12"
        entry: python -m pytest -q -p no:cacheprovider tests/unit/test_openapi_conformance.py
        files: ^(supersetapiplus/|tests/fixtures/superset_openapi_|tests/unit/test_openapi_conformance\.py)
        pass_filenames: false
      - id: model-attributes
        # Model attributes vs. the Superset source: every enum has a declared source and its official values,
        # every `str` field is an enum or declared free text (tests/fixtures/superset_enums_<version>.json,
        # generated by bin/scripts/extract_superset_enums.py).
        name: Model attributes (enums and str fields vs. the Superset source)
        language: python
        additional_dependencies:
          - "requests>=2.32"
          - "beautifulsoup4>=4.12"
          - "pyyaml>=6.0"
          - "anytree>=2.12"
          - "shortuuid>=1.0"
          - "typing_extensions>=4.12"
          - "pytest>=8"
          - "requests-mock>=1.12"
        entry: python -m pytest -q -p no:cacheprovider tests/unit/test_enum_conformance.py tests/unit/test_attribute_types.py
        files: ^(supersetapiplus/|tests/fixtures/superset_enums_|tests/unit/test_(enum_conformance|attribute_types)\.py)
        pass_filenames: false
